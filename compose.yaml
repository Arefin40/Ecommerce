services:
   app:
      build:
         context: .
         target: final
      image: nextjs-dev
      ports:
         - "3000:3000"
      environment:
         NODE_ENV: development
      develop:
         watch:
            - action: sync
              path: ./src
              target: /app/src
              ignore:
                 - node_modules/
            - action: rebuild
              path: package.json

   db:
      image: postgres:16-alpine
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: admin
         POSTGRES_DB: shobai
      ports:
         - "5432:5432"
